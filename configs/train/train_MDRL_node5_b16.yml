# Node5 reproduction: original model/split/optimizer; approved schedule adaptation.
logdir: /home/zhuenqiang_1/Student_Project/zms/experiment_data/mdrl/pretrain

model:
  name: diffusion
  node_dim: 128
  edge_dim: 32
  denoiser:
    backbone: NodeEdgeNet
    num_blocks: 6
    cutoff: 15
    use_gate: True
  diff:
    num_timesteps: 1000
    time_dim: 10
    categorical_space: discrete
    diff_pos:
      beta_schedule: advance
      scale_start: 0.9999
      scale_end: 0.0001
      width: 3
    diff_atom:
      init_prob: tomask
      beta_schedule: advance
      scale_start: 0.9999
      scale_end: 0.0001
      width: 3
    diff_bond:
      init_prob: absorb
      beta_schedule: segment
      time_segment: [600, 400]
      segment_diff:
        - scale_start: 0.9999
          scale_end: 0.001
          width: 3
        - scale_start: 0.001
          scale_end: 0.0001
          width: 2

train:
  seed: 2023
  batch_size: 16
  num_workers: 14
  pin_memory: True
  max_iters: 2_400_000
  val_every_epochs: 10
  # The PBS generator recomputes this from the effective original split.
  val_freq: 144710
  checkpoint_freq: 5000
  checkpoint_milestones: [1600000, 2400000]
  max_checkpoint_files: 50
  pos_noise_std: 0.05
  max_grad_norm: 50.0
  use_amp: True
  optimizer:
    type: adamw
    lr: 1.e-4
    weight_decay: 1.e-8
    beta1: 0.99
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.8
    patience: 1000
    min_lr: 1.e-5

transform:
  use_mask_node: True
  use_mask_edge: True

dataset:
  name: drug3d
  root: /home/zhuenqiang_1/Student_Project/zms/raw_data/MDRL/geom_drug
  path_dict:
    sdf: sdf
    summary: mol_summary.csv
    processed: processed.lmdb
  split: split_by_molid.pt

chem:
  atomic_numbers: [6,7,8,9,15,16,17]
  mol_bond_types: [1,2,3,4]
